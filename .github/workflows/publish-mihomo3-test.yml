name: Publish Mihomo3 Test Release

on:
  push:
    branches:
      - main
    paths:
      - ci/publish-mihomo3-test.txt

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify successful Mihomo3 artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          ARTIFACT_ID='9475124671'
          RUN_ID='32570161333'
          mkdir -p dist
          gh api "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/mihomo3.zip
          unzip -q /tmp/mihomo3.zip -d dist
          test -f dist/XVPN-v1.1.1-mihomo3.apk
          test -f dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          RUN_HEAD="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.head_branch + " " + .conclusion)"
          test "$RUN_HEAD" = 'dev/mihomo-core-v1 success'
          echo "artifact verified: $(stat -c %s dist/XVPN-v1.1.1-mihomo3.apk) bytes"

      - name: Create verified prerelease and upload APK
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TAG='v1.1.1-mihomo3-test'
          TARGET='2532215802e1fb3a1c1b60466dbc65c775bf1648'
          TITLE='XVPN v1.1.1-mihomo3 · 测试版'
          BODY=$(cat <<'EOF'
          ⚠️ 测试版 / Pre-release，请勿作为正式稳定版分发。

          本轮重点：
          - Mihomo 1.19.28 / Clash Meta 数据面
          - 智能分流：私网/本地 + 中国域名 + 中国 IPv4/IPv6 直连，其余走代理
          - MetaCubeX CN MRS 固定 commit 并做 SHA-256 校验后内置 APK
          - 规则启动时本地校验，不依赖首次联网下载
          - App“版本”处显示 Mihomo 内核版本
          - 不调整现有 UI 布局、操作逻辑、节点测速/自动优选逻辑

          真机测试重点：智能分流下国内网站是否直连、国外网站是否代理、iplark 出口 IP、DNS/IPv6、防泄漏、连接状态切换模式/节点。
          EOF
          )

          if gh api "repos/${REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Unexpected existing release ${TAG}; refusing to overwrite"
            exit 1
          fi
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Unexpected existing tag ${TAG}; refusing to overwrite"
            exit 1
          fi

          RELEASE_JSON="$(gh api --method POST "repos/${REPO}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$TARGET" \
            -f name="$TITLE" \
            -f body="$BODY" \
            -F draft=false \
            -F prerelease=true)"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"
          test -n "$RELEASE_ID" && test "$RELEASE_ID" != null

          gh release upload "$TAG" \
            dist/XVPN-v1.1.1-mihomo3.apk \
            dist/SHA256SUMS.txt \
            --repo "$REPO"

          CHECK="$(gh api "repos/${REPO}/releases/tags/${TAG}")"
          test "$(printf '%s' "$CHECK" | jq -r '.prerelease')" = true
          test "$(printf '%s' "$CHECK" | jq -r '.draft')" = false
          test "$(printf '%s' "$CHECK" | jq -r '.tag_name')" = "$TAG"
          printf '%s' "$CHECK" | jq -e '.assets | map(.name) | index("XVPN-v1.1.1-mihomo3.apk") != null' >/dev/null
          printf '%s' "$CHECK" | jq -e '.assets | map(.name) | index("SHA256SUMS.txt") != null' >/dev/null
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Remove previous Mihomo2 test release only after Mihomo3 verification
        id: old_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          OLD_TAG='v1.1.1-mihomo2-test'
          OLD_ID="$(gh api "repos/${REPO}/releases/tags/${OLD_TAG}" --jq '.id' 2>/dev/null || true)"
          if [ -n "$OLD_ID" ]; then
            gh api --method DELETE "repos/${REPO}/releases/${OLD_ID}"
          fi
          if gh api "repos/${REPO}/git/ref/tags/${OLD_TAG}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${REPO}/git/refs/tags/${OLD_TAG}"
          fi
          if gh api "repos/${REPO}/releases/tags/${OLD_TAG}" >/dev/null 2>&1; then
            echo 'Old Mihomo2 test release still exists'
            exit 1
          fi
          if gh api "repos/${REPO}/git/ref/tags/${OLD_TAG}" >/dev/null 2>&1; then
            echo 'Old Mihomo2 test tag still exists'
            exit 1
          fi

      - name: Delete completed failed Actions runs
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          mapfile -t RUNS < <(gh api --paginate "repos/${REPO}/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[] | select(.conclusion == "failure") | .id')
          COUNT=0
          for RUN in "${RUNS[@]:-}"; do
            [ -n "$RUN" ] || continue
            gh api --method DELETE "repos/${REPO}/actions/runs/${RUN}" >/dev/null
            COUNT=$((COUNT+1))
          done
          echo "deleted_failed_runs=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Record release result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          OLD_RELEASE_OUTCOME: ${{ steps.old_release.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          DELETED_FAILED: ${{ steps.cleanup.outputs.deleted_failed_runs }}
        run: |
          set -euo pipefail
          BODY="run_id=${GITHUB_RUN_ID}\nartifact=${ARTIFACT_OUTCOME:-not-run}\nrelease=${RELEASE_OUTCOME:-not-run}\nold_release_cleanup=${OLD_RELEASE_OUTCOME:-not-run}\nfailed_runs_cleanup=${CLEANUP_OUTCOME:-not-run}\ndeleted_failed_runs=${DELETED_FAILED:-0}\ntag=v1.1.1-mihomo3-test\nupdated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          CONTENT="$(printf '%b' "$BODY" | base64 -w0)"
          API="repos/${GITHUB_REPOSITORY}/contents/ci/mihomo3-release-status.txt"
          SHA="$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message='chore: record Mihomo3 release status [skip ci]' -f content="$CONTENT" -f branch=main -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message='chore: record Mihomo3 release status [skip ci]' -f content="$CONTENT" -f branch=main >/dev/null
          fi

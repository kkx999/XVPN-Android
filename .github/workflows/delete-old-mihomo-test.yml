name: Delete Old Mihomo Test Release

on:
  push:
    branches:
      - dev/mihomo-core-v1
    paths:
      - ci/delete-old-mihomo-test.txt

permissions:
  contents: write

jobs:
  delete-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Delete old test release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.1-mihomo1-test'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          else
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Old test release still exists'
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo 'Old test tag still exists'
            exit 1
          fi

          mkdir -p ci
          {
            echo 'cleanup=success'
            echo "deleted_release=${TAG}"
            echo 'release_exists=false'
            echo 'tag_exists=false'
            echo "updated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci/delete-old-mihomo-test-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ci/delete-old-mihomo-test-status.txt
          git commit -m 'chore: record old test release cleanup [skip ci]'
          git push origin HEAD:dev/mihomo-core-v1

name: Patch Mihomo4 Stability

on:
  push:
    branches:
      - dev/mihomo-core-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore: add mihomo4 stability patch workflow' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/mihomo-core-v1
          fetch-depth: 0

      - name: Apply drawer and VPN lifecycle fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(label + ' anchor missing')
              return text.replace(old, new, 1)

          # MainActivity: debounce connect actions, fail safely if Android rejects
          # a service lifecycle request, and reset country expansion on each open.
          p = Path('app/src/main/java/com/xvpn/android/MainActivity.java')
          s = p.read_text()
          s = replace_once(s,
              '    private static final long UPDATE_CHECK_INTERVAL_MS = 12L * 60L * 60L * 1000L;\n',
              '    private static final long UPDATE_CHECK_INTERVAL_MS = 12L * 60L * 60L * 1000L;\n    private static final long CONNECT_ACTION_GUARD_MS = 500L;\n',
              'connect guard constant')
          s = replace_once(s,
              '    private boolean coreReceiverRegistered;\n',
              '    private boolean coreReceiverRegistered;\n    private long lastConnectActionAt;\n',
              'connect guard field')
          s = replace_once(s,
              '        CoreState.Snapshot core=CoreState.read(this);\n        if(core.state==CoreState.RUNNING){\n            VpnCoreService.stop(this);\n            refreshCoreBoundViews();\n            return;\n        }',
              '        long actionNow=SystemClock.uptimeMillis();\n        if(lastConnectActionAt!=0L && actionNow-lastConnectActionAt<CONNECT_ACTION_GUARD_MS)return;\n        lastConnectActionAt=actionNow;\n        CoreState.Snapshot core=CoreState.read(this);\n        if(core.state==CoreState.RUNNING){\n            try{VpnCoreService.stop(this);}\n            catch(RuntimeException error){toast("无法提交断开请求，请稍后重试");}\n            refreshCoreBoundViews();\n            return;\n        }',
              'handleConnect debounce')
          s = replace_once(s,
              '        clearPendingCore();\n        VpnCoreService.start(this,config,id,name,label,latencyTestUrl());\n        refreshCoreBoundViews();',
              '        clearPendingCore();\n        try{VpnCoreService.start(this,config,id,name,label,latencyTestUrl());}\n        catch(RuntimeException error){toast("VPN 服务正在切换，请稍后重试");}\n        refreshCoreBoundViews();',
              'safe VPN start')
          s = replace_once(s,
              '            String key="node_country_collapsed_"+c.code;\n            boolean selectedHere=countryContainsSelected(c);\n            boolean collapsed=prefs.contains(key)?prefs.getBoolean(key,false):!selectedHere;\n            if(selectedHere) collapsed=false;\n',
              '            boolean selectedHere=countryContainsSelected(c);\n            // Every new picker opens only the country containing the selected node.\n            // Expansion changes are intentionally session-local and are not persisted.\n            boolean collapsed=!selectedHere;\n',
              'country initial expansion')
          s = replace_once(s,
              '                arrow.animateExpanded(!hide); prefs.edit().putBoolean(key,hide).apply();\n',
              '                arrow.animateExpanded(!hide);\n',
              'country expansion persistence')
          p.write_text(s)

          # Scroll container: let ScrollView receive ACTION_DOWN for normal rows.
          # Previously the custom sheet returned before super(), so drags that
          # began on clickable node cards often could not become scroll gestures.
          p = Path('app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java')
          s = p.read_text()
          s = replace_once(s,
              '        if(event.getActionMasked()==MotionEvent.ACTION_DOWN){\n            begin(event);\n            // The top strip contains only the visual handle, so taking its DOWN\n            // event cannot steal taps from sheet controls or normal scrolling.\n            return handleGesture;\n        }\n        return super.onInterceptTouchEvent(event);',
              '        if(event.getActionMasked()==MotionEvent.ACTION_DOWN){\n            begin(event);\n            // The handle owns only the top drag strip. For every other DOWN,\n            // ScrollView must see the event so it can later intercept MOVE from\n            // clickable node rows and turn it into a normal vertical scroll.\n            if(handleGesture)return true;\n            return super.onInterceptTouchEvent(event);\n        }\n        return super.onInterceptTouchEvent(event);',
              'bottom sheet scroll interception')
          p.write_text(s)

          # VpnCoreService: reject duplicate START while STARTING/SWITCHING/
          # STOPPING, keep STOPPED until the Service is really destroyed, and
          # make executor shutdown races non-fatal.
          p = Path('app/src/main/java/com/xvpn/android/VpnCoreService.java')
          s = p.read_text()
          s = replace_once(s,
              'import java.util.concurrent.Executors;\nimport java.util.concurrent.ScheduledExecutorService;',
              'import java.util.concurrent.Executors;\nimport java.util.concurrent.RejectedExecutionException;\nimport java.util.concurrent.ScheduledExecutorService;',
              'RejectedExecutionException import')
          s = replace_once(s,
              '        if (ACTION_STOP.equals(action)) {\n            requestStop();\n            return START_NOT_STICKY;\n        }\n\n        if (ACTION_RECONFIGURE.equals(action) && intent != null) {',
              '        if (ACTION_STOP.equals(action)) {\n            requestStop();\n            return START_NOT_STICKY;\n        }\n\n        if (ACTION_START.equals(action)) {\n            CoreState.Snapshot current = CoreState.read(this);\n            if (stopRequested.get() || current.state == CoreState.STARTING\n                    || current.state == CoreState.SWITCHING || current.state == CoreState.STOPPING) {\n                return START_NOT_STICKY;\n            }\n            if (current.state == CoreState.RUNNING || tunStarted) return START_STICKY;\n        }\n\n        if (ACTION_RECONFIGURE.equals(action) && intent != null) {',
              'duplicate start guard')
          s = replace_once(s,
              '            establishAndStartTun();\n            if (stopRequested.get()) { stopCoreInternal(); return; }\n',
              '            establishAndStartTun();\n            // requestStop() already serializes stopCoreInternal on coreExecutor.\n            // Do not execute it a second time from this START task.\n            if (stopRequested.get()) return;\n',
              'single stop serialization')
          s = replace_once(s,
              '        cleanupCoreObjects();\n        CoreState.Snapshot state = CoreState.read(this);\n        if (state.isActive()) CoreState.publishLifecycle(this, CoreState.STOPPED, state.nodeId, state.nodeName, "");\n        coreExecutor.shutdownNow();\n        reportIo.shutdown();\n        super.onDestroy();',
              '        cleanupCoreObjects();\n        CoreState.Snapshot state = CoreState.read(this);\n        coreExecutor.shutdownNow();\n        reportIo.shutdown();\n        // Publish STOPPED only when Android is actually destroying this Service.\n        // This prevents a rapid reconnect from racing the previous stopSelf().\n        if (state.isActive()) CoreState.publishLifecycle(this, CoreState.STOPPED, state.nodeId, state.nodeName, "");\n        super.onDestroy();',
              'destroy lifecycle ordering')
          s = replace_once(s,
              '        updateForegroundNotification("XVPN 正在断开", displayNodeName() + " · 正在保存连接数据", false);\n        coreExecutor.execute(this::stopCoreInternal);',
              '        updateForegroundNotification("XVPN 正在断开", displayNodeName() + " · 正在保存连接数据", false);\n        try { coreExecutor.execute(this::stopCoreInternal); }\n        catch (RejectedExecutionException ignored) { stopCoreInternal(); }',
              'safe stop executor')
          s = replace_once(s,
              '        cleanupCoreObjects();\n        CoreState.publishLifecycle(this, CoreState.STOPPED, nodeId, nodeName, "");\n        stopForeground(STOP_FOREGROUND_REMOVE);\n        stopSelf();',
              '        cleanupCoreObjects();\n        // Keep CoreState at STOPPING until onDestroy() completes.\n        stopForeground(STOP_FOREGROUND_REMOVE);\n        stopSelf();',
              'defer stopped state')
          s = replace_once(s,
              '        if (finalSnapshot != null) reportIo.execute(() -> reportTrafficSafe(finalSnapshot));',
              '        if (finalSnapshot != null && !reportIo.isShutdown()) {\n            try { reportIo.execute(() -> reportTrafficSafe(finalSnapshot)); }\n            catch (RejectedExecutionException ignored) {}\n        }',
              'safe report executor')
          p.write_text(s)

          # Version this device-test build independently.
          p = Path('app/build.gradle')
          s = p.read_text()
          s = replace_once(s, "        versionCode 10104\n        versionName '1.1.1-mihomo3'", "        versionCode 10105\n        versionName '1.1.1-mihomo4'", 'app version')
          p.write_text(s)
          Path('VERSION').write_text('1.1.1-mihomo4\n')

          # Keep the normal CI identity check aligned with this test version.
          p = Path('.github/workflows/build-apk.yml')
          s = p.read_text()
          s = replace_once(s, "            grep -Fq \"versionName '1.1.1-mihomo3'\" app/build.gradle", "            grep -Fq \"versionName '1.1.1-mihomo4'\" app/build.gradle", 'CI version check')
          # Add explicit regression guards without changing build semantics.
          marker = "            grep -Fq 'BuildConfig.MIHOMO_CORE_VERSION' app/src/main/java/com/xvpn/android/MainActivity.java\n"
          extra = marker + "            grep -Fq 'CONNECT_ACTION_GUARD_MS' app/src/main/java/com/xvpn/android/MainActivity.java\n            grep -Fq 'boolean collapsed=!selectedHere;' app/src/main/java/com/xvpn/android/MainActivity.java\n            grep -Fq 'if(handleGesture)return true;' app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java\n            grep -Fq 'current.state == CoreState.STARTING' app/src/main/java/com/xvpn/android/VpnCoreService.java\n"
          if 'CONNECT_ACTION_GUARD_MS' not in s:
              if marker not in s:
                  raise SystemExit('CI regression guard anchor missing')
              s = s.replace(marker, extra, 1)
          p.write_text(s)
          PY

          git diff --check
          grep -Fq "versionName '1.1.1-mihomo4'" app/build.gradle
          grep -Fq 'boolean collapsed=!selectedHere;' app/src/main/java/com/xvpn/android/MainActivity.java
          grep -Fq 'if(handleGesture)return true;' app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java
          grep -Fq 'current.state == CoreState.STARTING' app/src/main/java/com/xvpn/android/VpnCoreService.java

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/com/xvpn/android/MainActivity.java \
                     app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java \
                     app/src/main/java/com/xvpn/android/VpnCoreService.java \
                     app/build.gradle VERSION .github/workflows/build-apk.yml
          git diff --cached --check
          git commit -m 'fix: harden node drawer and rapid VPN toggles'
          git push origin HEAD:dev/mihomo-core-v1

name: Apply Mihomo3 Core-only Patch

on:
  push:
    branches:
      - main
    paths:
      - ci/apply-mihomo3-core-only.txt

permissions:
  contents: write

jobs:
  patch-dev:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Mihomo dev branch
        uses: actions/checkout@v6
        with:
          ref: dev/mihomo-core-v1
          fetch-depth: 0

      - name: Patch only core routing, version text, tests and CI
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Only change the existing version subtitle text. No layout/interaction changes.
          p=Path('app/src/main/java/com/xvpn/android/MainActivity.java')
          s=p.read_text()
          old='View versionRow=settingRow("版本",BuildConfig.VERSION_NAME + " · 检查更新",()->checkForUpdates(true));'
          new='View versionRow=settingRow("版本",BuildConfig.VERSION_NAME + " · Mihomo " + BuildConfig.MIHOMO_CORE_VERSION + " · 检查更新",()->checkForUpdates(true));'
          if old not in s:
              raise SystemExit('MainActivity version text anchor missing')
          p.write_text(s.replace(old,new,1))

          # Materialize bundled, hash-pinned MRS files into Mihomo home before loading config.
          p=Path('app/src/main/java/com/xvpn/android/VpnCoreService.java')
          s=p.read_text()
          replacements=[
            ('import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.io.OutputStreamWriter;',
             'import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.io.InputStream;\nimport java.io.OutputStreamWriter;'),
            ('import java.nio.charset.StandardCharsets;\nimport java.util.Locale;',
             'import java.nio.charset.StandardCharsets;\nimport java.security.MessageDigest;\nimport java.util.Locale;'),
            ('        File home = new File(getFilesDir(), "mihomo");\n        if (!home.exists() && !home.mkdirs()) throw new IOException("无法创建 Mihomo 配置目录");\n        File config = new File(home, "config.yaml");',
             '        File home = new File(getFilesDir(), "mihomo");\n        if (!home.exists() && !home.mkdirs()) throw new IOException("无法创建 Mihomo 配置目录");\n        ensureBundledMihomoRules(home);\n        File config = new File(home, "config.yaml");')]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('VpnCoreService anchor missing: '+old[:70])
              s=s.replace(old,new,1)
          anchor='    private void applyMihomoProfile(String sourceConfig, String label) throws Exception {'
          if anchor not in s:
              raise SystemExit('applyMihomoProfile anchor missing')
          helper=r'''    private void ensureBundledMihomoRules(File home) throws Exception {
        File rulesDir = new File(home, "rules");
        if (!rulesDir.exists() && !rulesDir.mkdirs()) throw new IOException("无法创建 Mihomo 规则目录");
        installBundledRule("mihomo-rules/geosite-cn.mrs", new File(rulesDir, "geosite-cn.mrs"), BuildConfig.MIHOMO_GEOSITE_CN_SHA256);
        installBundledRule("mihomo-rules/geoip-cn.mrs", new File(rulesDir, "geoip-cn.mrs"), BuildConfig.MIHOMO_GEOIP_CN_SHA256);
    }

    private void installBundledRule(String assetPath, File target, String expectedSha256) throws Exception {
        if (target.isFile() && expectedSha256.equalsIgnoreCase(sha256(target))) return;
        File temp = new File(target.getParentFile(), target.getName() + ".tmp");
        if (temp.exists() && !temp.delete()) throw new IOException("无法清理 Mihomo 规则临时文件");
        try (InputStream input = getAssets().open(assetPath); FileOutputStream output = new FileOutputStream(temp, false)) {
            byte[] buffer = new byte[64 * 1024];
            int read;
            while ((read = input.read(buffer)) != -1) if (read > 0) output.write(buffer, 0, read);
            output.getFD().sync();
        }
        String actual = sha256(temp);
        if (!expectedSha256.equalsIgnoreCase(actual)) {
            temp.delete();
            throw new IOException("Mihomo 内置规则校验失败：" + assetPath);
        }
        if (target.exists() && !target.delete()) {
            temp.delete();
            throw new IOException("无法替换 Mihomo 规则：" + target.getName());
        }
        if (!temp.renameTo(target)) {
            try (InputStream input = new java.io.FileInputStream(temp); FileOutputStream output = new FileOutputStream(target, false)) {
                byte[] buffer = new byte[64 * 1024];
                int read;
                while ((read = input.read(buffer)) != -1) if (read > 0) output.write(buffer, 0, read);
                output.getFD().sync();
            }
            if (!temp.delete()) Log.w(TAG, "Unable to delete Mihomo rule temp file: " + temp);
        }
    }

    private static String sha256(File file) throws Exception {
        MessageDigest digest = MessageDigest.getInstance("SHA-256");
        try (InputStream input = new java.io.FileInputStream(file)) {
            byte[] buffer = new byte[64 * 1024];
            int read;
            while ((read = input.read(buffer)) != -1) if (read > 0) digest.update(buffer, 0, read);
        }
        StringBuilder out = new StringBuilder(64);
        for (byte b : digest.digest()) out.append(String.format(Locale.US, "%02x", b & 0xff));
        return out.toString();
    }

'''
          p.write_text(s.replace(anchor,helper+anchor,1))

          # Regression test only for route-profile generation.
          p=Path('app/src/test/java/com/xvpn/android/SafeYamlTest.java')
          s=p.read_text()
          anchor='\n    @Test\n    public void trojanPasswordCannotBreakYaml() throws Exception {'
          if anchor not in s:
              raise SystemExit('SafeYamlTest anchor missing')
          test=r'''

    @Test
    public void smartModeUsesBundledCnDomainAndIpProviders() throws Exception {
        JSONObject outbound = new JSONObject()
                .put("type", "vless")
                .put("server", "example.com")
                .put("server_port", 443)
                .put("uuid", "11111111-2222-3333-4444-555555555555");
        String source = new JSONObject().put("outbounds", new JSONArray().put(outbound)).toString();
        String smart = MihomoProfileBuilder.build(source, "智能分流");
        assertTrue(smart.contains("\"rule-providers\""));
        assertTrue(smart.contains("\"XVPN-CN-DOMAIN\""));
        assertTrue(smart.contains("\"./rules/geosite-cn.mrs\""));
        assertTrue(smart.contains("RULE-SET,XVPN-CN-DOMAIN,DIRECT"));
        assertTrue(smart.contains("RULE-SET,XVPN-CN-IP,DIRECT,no-resolve"));
        String global = MihomoProfileBuilder.build(source, "全局模式");
        assertFalse(global.contains("\"rule-providers\""));
        assertFalse(global.contains("RULE-SET,XVPN-CN-DOMAIN,DIRECT"));
        assertFalse(global.contains("RULE-SET,XVPN-CN-IP,DIRECT,no-resolve"));
    }
'''
          p.write_text(s.replace(anchor,test+anchor,1))

          # Strengthen existing build verification without changing app behavior.
          p=Path('.github/workflows/build-apk.yml')
          s=p.read_text()
          old="            grep -Fq \"def mihomoWrapperVersion = '0.3.1'\" app/build.gradle\n            grep -Fq 'import io.github.oviron.libmihomo.Clash;' app/src/main/java/com/xvpn/android/VpnCoreService.java"
          new="            grep -Fq \"def mihomoWrapperVersion = '0.3.1'\" app/build.gradle\n            grep -Fq \"def mihomoCoreVersion = '1.19.28'\" app/build.gradle\n            grep -Fq \"def mihomoRulesCommit = '669d7042b3590f4d1a664469df27fee4ddf188d6'\" app/build.gradle\n            grep -Fq 'BuildConfig.MIHOMO_CORE_VERSION' app/src/main/java/com/xvpn/android/MainActivity.java\n            grep -Fq 'import io.github.oviron.libmihomo.Clash;' app/src/main/java/com/xvpn/android/VpnCoreService.java"
          if old not in s:
              raise SystemExit('build identity anchor missing')
          s=s.replace(old,new,1)
          old="            unzip -Z1 \"$APK\" | grep -Fx 'lib/arm64-v8a/libmihomo-jni.so'\n            if unzip -Z1 \"$APK\" | grep -F 'libbox.so'; then"
          new="            unzip -Z1 \"$APK\" | grep -Fx 'lib/arm64-v8a/libmihomo-jni.so'\n            unzip -Z1 \"$APK\" | grep -Fx 'assets/mihomo-rules/geosite-cn.mrs'\n            unzip -Z1 \"$APK\" | grep -Fx 'assets/mihomo-rules/geoip-cn.mrs'\n            unzip -p \"$APK\" assets/mihomo-rules/geosite-cn.mrs | sha256sum | grep -F 'a7368abc76702b0a7886d00054815df2fc0a1662239c916f1c4239c25e1af085'\n            unzip -p \"$APK\" assets/mihomo-rules/geoip-cn.mrs | sha256sum | grep -F 'a7db74faad22913bd2d193be4c33d46dddc2e0948ebff9f0fff044bb6416a734'\n            if unzip -Z1 \"$APK\" | grep -F 'libbox.so'; then"
          if old not in s:
              raise SystemExit('build APK anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check

      - name: Commit patch to dev branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/com/xvpn/android/MainActivity.java \
                     app/src/main/java/com/xvpn/android/VpnCoreService.java \
                     app/src/test/java/com/xvpn/android/SafeYamlTest.java \
                     .github/workflows/build-apk.yml
          git diff --cached --check
          git commit -m 'feat: finish Mihomo3 smart routing [skip ci]'
          git push origin HEAD:dev/mihomo-core-v1

      - name: Record result on main
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          set -euo pipefail
          BODY="run_id=${GITHUB_RUN_ID}\npatch=${PATCH_OUTCOME:-not-run}\ncommit=${COMMIT_OUTCOME:-not-run}\nupdated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          CONTENT="$(printf '%b' "$BODY" | base64 -w0)"
          API="repos/${GITHUB_REPOSITORY}/contents/ci/mihomo3-core-only-status.txt"
          SHA="$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message='chore: record Mihomo3 core-only patch status [skip ci]' -f content="$CONTENT" -f branch=main -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message='chore: record Mihomo3 core-only patch status [skip ci]' -f content="$CONTENT" -f branch=main >/dev/null
          fi

name: Apply Mihomo3 Core-only Patch

on:
  push:
    branches:
      - main
    paths:
      - ci/apply-mihomo3-core-only.txt

permissions:
  contents: write

jobs:
  patch-dev:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Mihomo dev branch
        uses: actions/checkout@v6
        with:
          ref: dev/mihomo-core-v1
          fetch-depth: 0

      - name: Finalize Mihomo routing DNS and network handling
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          # UI/interaction/latency-test freeze: verify the requested version text
          # exists, but do not otherwise edit MainActivity.
          ui=Path('app/src/main/java/com/xvpn/android/MainActivity.java').read_text()
          if 'BuildConfig.MIHOMO_CORE_VERSION' not in ui:
              raise SystemExit('Mihomo core version is not shown in the existing version row')

          # Rules are installed exactly once by MihomoRuleProvider at process
          # startup (also covers Always-on). Remove any redundant service-side
          # installer left by an earlier patch attempt.
          p=Path('app/src/main/java/com/xvpn/android/VpnCoreService.java')
          s=p.read_text()
          s=s.replace('        ensureBundledMihomoRules(home);\n','')
          s=re.sub(r'\n    private void ensureBundledMihomoRules\(File home\) throws Exception \{.*?\n    private void applyMihomoProfile\(',
                   '\n    private void applyMihomoProfile(', s, count=1, flags=re.S)
          if 'ensureBundledMihomoRules' not in s:
              s=s.replace('import java.io.InputStream;\n','')
              s=s.replace('import java.security.MessageDigest;\n','')

          # Observe physical-network changes, matching the important behavior of
          # Clash Android's NetworkObserveModule without touching app UI logic.
          if 'import android.net.NetworkRequest;' not in s:
              s=replace_once(s,'import android.net.NetworkCapabilities;\nimport android.net.VpnService;',
                             'import android.net.NetworkCapabilities;\nimport android.net.NetworkRequest;\nimport android.net.VpnService;',
                             'NetworkRequest import')
          if 'private ConnectivityManager.NetworkCallback underlyingNetworkCallback;' not in s:
              s=replace_once(s,'    private ConnectivityManager connectivity;\n    private ParcelFileDescriptor tunDescriptor;',
                             '    private ConnectivityManager connectivity;\n    private ConnectivityManager.NetworkCallback underlyingNetworkCallback;\n    private ParcelFileDescriptor tunDescriptor;',
                             'underlying network field')
          if 'registerUnderlyingNetworkObserver();' not in s:
              s=replace_once(s,'        connectivity = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);\n        createNotificationChannels();',
                             '        connectivity = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);\n        registerUnderlyingNetworkObserver();\n        createNotificationChannels();',
                             'network observer registration')
          if 'unregisterUnderlyingNetworkObserver();' not in s:
              s=replace_once(s,'        stopRequested.set(true);\n        shutdownSchedulers(false);',
                             '        stopRequested.set(true);\n        unregisterUnderlyingNetworkObserver();\n        shutdownSchedulers(false);',
                             'network observer unregistration')

          # Android 10+ should not classify the VPN interface itself as metered.
          if 'builder.setMetered(false);' not in s:
              s=replace_once(s,'                .addDnsServer("fdfe:dcba:9876::2")\n                .setBlocking(true);',
                             '                .addDnsServer("fdfe:dcba:9876::2")\n                .setBlocking(true);\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) builder.setMetered(false);',
                             'setMetered')

          # Keep the virtual DNS addresses advertised to Android, but hijack all
          # IPv4/IPv6 port-53 traffic in the native TUN so hard-coded DNS cannot
          # bypass Mihomo.
          old='                "172.19.0.1/30,fdfe:dcba:9876::1/126",\n                "172.19.0.2,fdfe:dcba:9876::2",\n                MihomoProfileBuilder.TUN_MTU);'
          new='                "172.19.0.1/30,fdfe:dcba:9876::1/126",\n                "0.0.0.0,::",\n                MihomoProfileBuilder.TUN_MTU);'
          s=replace_once(s,old,new,'Mihomo DNS hijack')

          # After TUN establishment, always bind to the latest validated physical
          # network. Subsequent callbacks refresh this when Wi-Fi/cellular changes.
          s=s.replace('        if (physical != null) setUnderlyingNetworks(new Network[]{physical});\n',
                      '        refreshUnderlyingNetwork();\n',1)

          if 'private void registerUnderlyingNetworkObserver()' not in s:
              anchor='    private Network physicalNetwork() {'
              if anchor not in s:
                  raise SystemExit('physicalNetwork anchor missing')
              helper=r'''    private void registerUnderlyingNetworkObserver() {
        if (connectivity == null || underlyingNetworkCallback != null) return;
        NetworkRequest request = new NetworkRequest.Builder()
                .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                .addCapability(NetworkCapabilities.NET_CAPABILITY_NOT_VPN)
                .build();
        underlyingNetworkCallback = new ConnectivityManager.NetworkCallback() {
            @Override public void onAvailable(Network network) { refreshUnderlyingNetwork(); }
            @Override public void onCapabilitiesChanged(Network network, NetworkCapabilities capabilities) { refreshUnderlyingNetwork(); }
            @Override public void onLost(Network network) { refreshUnderlyingNetwork(); }
        };
        try { connectivity.registerNetworkCallback(request, underlyingNetworkCallback); }
        catch (Exception error) {
            Log.w(TAG, "Unable to observe physical network changes", error);
            underlyingNetworkCallback = null;
        }
    }

    private void unregisterUnderlyingNetworkObserver() {
        ConnectivityManager.NetworkCallback callback = underlyingNetworkCallback;
        underlyingNetworkCallback = null;
        if (connectivity != null && callback != null) {
            try { connectivity.unregisterNetworkCallback(callback); }
            catch (Exception ignored) {}
        }
    }

    private void refreshUnderlyingNetwork() {
        if (tunDescriptor == null) return;
        Network network = physicalNetwork();
        if (network == null) return;
        try { setUnderlyingNetworks(new Network[]{network}); }
        catch (Exception error) { Log.w(TAG, "Unable to update VPN underlying network", error); }
    }

'''
              s=s.replace(anchor,helper+anchor,1)
          p.write_text(s)

          # Split DNS policy and private/local routing live in the profile only.
          p=Path('app/src/main/java/com/xvpn/android/MihomoProfileBuilder.java')
          s=p.read_text()
          s=replace_once(s,'.put("dns", buildDns());','.put("dns", buildDns(global));','buildDns(global)')
          old=r'''    private static JSONObject buildDns() throws Exception {
        return new JSONObject()
                .put("enable", true)
                .put("ipv6", true)
                .put("use-hosts", true)
                .put("respect-rules", true)
                .put("enhanced-mode", "fake-ip")
                .put("fake-ip-range", "198.18.0.1/16")
                .put("fake-ip-filter", new JSONArray()
                        .put("*.lan")
                        .put("*.local")
                        .put("localhost")
                        .put("*.home.arpa"))
                .put("default-nameserver", new JSONArray().put("223.5.5.5").put("119.29.29.29"))
                .put("proxy-server-nameserver", new JSONArray().put("223.5.5.5").put("119.29.29.29"))
                .put("nameserver", new JSONArray()
                        .put("https://1.1.1.1/dns-query")
                        .put("https://8.8.8.8/dns-query"));
    }
'''
          new=r'''    private static JSONObject buildDns(boolean global) throws Exception {
        JSONArray domesticDns = new JSONArray()
                .put("https://dns.alidns.com/dns-query")
                .put("https://doh.pub/dns-query");
        JSONObject dns = new JSONObject()
                .put("enable", true)
                .put("ipv6", true)
                .put("use-hosts", true)
                .put("use-system-hosts", true)
                .put("respect-rules", true)
                .put("enhanced-mode", "fake-ip")
                .put("fake-ip-range", "198.18.0.1/16")
                .put("fake-ip-filter-mode", "blacklist")
                .put("fake-ip-filter", new JSONArray()
                        .put("+.lan")
                        .put("+.local")
                        .put("localhost")
                        .put("+.home.arpa"))
                .put("default-nameserver", new JSONArray().put("223.5.5.5").put("119.29.29.29"))
                .put("proxy-server-nameserver", new JSONArray().put("223.5.5.5").put("119.29.29.29"))
                .put("direct-nameserver", domesticDns)
                .put("direct-nameserver-follow-policy", true)
                .put("nameserver", new JSONArray()
                        .put("https://1.1.1.1/dns-query")
                        .put("https://8.8.8.8/dns-query"));
        if (!global) {
            dns.put("nameserver-policy", new JSONObject()
                    .put("rule-set:" + CN_DOMAIN_PROVIDER, domesticDns));
        }
        return dns;
    }
'''
          if 'private static JSONObject buildDns(boolean global)' not in s:
              if old not in s:
                  raise SystemExit('buildDns method anchor missing')
              s=s.replace(old,new,1)

          if 'IP-CIDR,100.64.0.0/10,DIRECT,no-resolve' not in s:
              s=replace_once(s,
                  '                .put("IP-CIDR,10.0.0.0/8,DIRECT,no-resolve")\n                .put("IP-CIDR,172.16.0.0/12,DIRECT,no-resolve")',
                  '                .put("IP-CIDR,10.0.0.0/8,DIRECT,no-resolve")\n                .put("IP-CIDR,100.64.0.0/10,DIRECT,no-resolve")\n                .put("IP-CIDR,172.16.0.0/12,DIRECT,no-resolve")',
                  'CGNAT rule')
          if 'IP-CIDR,224.0.0.0/4,DIRECT,no-resolve' not in s:
              s=replace_once(s,
                  '                .put("IP-CIDR,169.254.0.0/16,DIRECT,no-resolve")\n                .put("IP-CIDR6,::1/128,DIRECT,no-resolve")',
                  '                .put("IP-CIDR,169.254.0.0/16,DIRECT,no-resolve")\n                .put("IP-CIDR,224.0.0.0/4,DIRECT,no-resolve")\n                .put("IP-CIDR6,::1/128,DIRECT,no-resolve")',
                  'IPv4 multicast rule')
          if 'IP-CIDR6,ff00::/8,DIRECT,no-resolve' not in s:
              s=replace_once(s,
                  '                .put("IP-CIDR6,fc00::/7,DIRECT,no-resolve")\n                .put("IP-CIDR6,fe80::/10,DIRECT,no-resolve");',
                  '                .put("IP-CIDR6,fc00::/7,DIRECT,no-resolve")\n                .put("IP-CIDR6,fe80::/10,DIRECT,no-resolve")\n                .put("IP-CIDR6,ff00::/8,DIRECT,no-resolve");',
                  'IPv6 multicast rule')
          p.write_text(s)

          # Extend the dedicated smart-routing tests; do not touch latency tests.
          p=Path('app/src/test/java/com/xvpn/android/MihomoSmartRoutingTest.java')
          s=p.read_text()
          if 'smartModeUsesCnSplitDnsPolicy' not in s:
              anchor='\n    @Test public void auxiliaryOutboundCannotBeMistakenForProxy() throws Exception {'
              if anchor not in s:
                  raise SystemExit('MihomoSmartRoutingTest anchor missing')
              test=r'''

    @Test public void smartModeUsesCnSplitDnsPolicy() throws Exception {
        String smart = MihomoProfileBuilder.build(vlessSource(), RouteMode.SMART.label);
        assertTrue(smart.contains("rule-set:XVPN-CN-DOMAIN"));
        assertTrue(smart.contains("https://dns.alidns.com/dns-query"));
        assertTrue(smart.contains("https://doh.pub/dns-query"));
        assertTrue(smart.contains("https://1.1.1.1/dns-query"));
        assertTrue(smart.contains("IP-CIDR,100.64.0.0/10,DIRECT,no-resolve"));
        assertTrue(smart.contains("IP-CIDR6,ff00::/8,DIRECT,no-resolve"));

        String global = MihomoProfileBuilder.build(vlessSource(), RouteMode.GLOBAL.label);
        assertFalse(global.contains("rule-set:XVPN-CN-DOMAIN"));
    }
'''
              s=s.replace(anchor,test+anchor,1)
          p.write_text(s)

          # CI assertions for the core-only changes.
          p=Path('.github/workflows/build-apk.yml')
          s=p.read_text()
          marker="            grep -Fq 'RULE-SET,' app/src/main/java/com/xvpn/android/MihomoProfileBuilder.java\n"
          additions=("            grep -Fq 'nameserver-policy' app/src/main/java/com/xvpn/android/MihomoProfileBuilder.java\n"
                     "            grep -Fq '\"0.0.0.0,::\"' app/src/main/java/com/xvpn/android/VpnCoreService.java\n"
                     "            grep -Fq 'registerUnderlyingNetworkObserver' app/src/main/java/com/xvpn/android/VpnCoreService.java\n")
          if additions not in s:
              if marker not in s:
                  raise SystemExit('build workflow routing marker missing')
              s=s.replace(marker,marker+additions,1)
          p.write_text(s)
          PY

          git diff --check

      - name: Commit patch to dev branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No additional changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/com/xvpn/android/VpnCoreService.java \
                     app/src/main/java/com/xvpn/android/MihomoProfileBuilder.java \
                     app/src/test/java/com/xvpn/android/MihomoSmartRoutingTest.java \
                     .github/workflows/build-apk.yml
          git diff --cached --check
          git commit -m 'feat: finalize Mihomo3 DNS and network routing [skip ci]'
          git push origin HEAD:dev/mihomo-core-v1

      - name: Record result on main
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          set -euo pipefail
          BODY="run_id=${GITHUB_RUN_ID}\npatch=${PATCH_OUTCOME:-not-run}\ncommit=${COMMIT_OUTCOME:-not-run}\nupdated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          CONTENT="$(printf '%b' "$BODY" | base64 -w0)"
          API="repos/${GITHUB_REPOSITORY}/contents/ci/mihomo3-core-only-status.txt"
          SHA="$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message='chore: record Mihomo3 final core patch status [skip ci]' -f content="$CONTENT" -f branch=main -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message='chore: record Mihomo3 final core patch status [skip ci]' -f content="$CONTENT" -f branch=main >/dev/null
          fi

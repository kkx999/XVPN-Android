name: Publish Mihomo2 Test Release Main

on:
  push:
    branches:
      - main
    paths:
      - ci/publish-mihomo2-test-main.txt

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified Mihomo2 artifact
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 32544173639 --repo "$GITHUB_REPOSITORY" --name 'XVPN-v1.1.1-mihomo2' --dir dist
          test -f dist/XVPN-v1.1.1-mihomo2.apk
          test -f dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Publish pre-release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.1-mihomo2-test'
          cat > release-notes.md <<'EOF'
          ## ⚠️ 测试版 / Pre-release

          这是 XVPN Android 使用 **Mihomo / Clash Meta 内核**的第二版测试包，不是正式稳定版。

          **版本：** 1.1.1-mihomo2  
          **架构：** arm64-v8a

          ### 本次修复
          - 修复 `config.yaml` 的 YAML 转义兼容问题
          - 不再把 JSON 文本直接当作 YAML 配置
          - 安全处理反斜杠、引号、WebSocket path、密码等特殊字符
          - 增加 YAML 特殊字符回归测试

          ### 请重点测试
          - VPN 连接 / 断开
          - 全局模式 / 智能分流
          - 节点切换
          - iplark 出口 IP
          - DNS / IPv6 泄漏
          - Panel 流量上报

          此 APK 已通过 GitHub Actions 单元测试、lint、签名、包信息及 Mihomo native core 校验。
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/XVPN-v1.1.1-mihomo2.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'XVPN v1.1.1-mihomo2 · 测试版' --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" \
              dist/XVPN-v1.1.1-mihomo2.apk dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target 371e09b23abf8f4e37810a8b62dde2fa7ffe7318 \
              --title 'XVPN v1.1.1-mihomo2 · 测试版' \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Verify release
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.1.1-mihomo2-test")"
          echo "$JSON" | jq -e '.prerelease == true and .draft == false' >/dev/null
          echo "$JSON" | jq -e '[.assets[].name] | index("XVPN-v1.1.1-mihomo2.apk") != null' >/dev/null
          echo "$JSON" | jq -e '[.assets[].name] | index("SHA256SUMS.txt") != null' >/dev/null

      - name: Record publisher status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          URL="$(gh release view v1.1.1-mihomo2-test --repo "$GITHUB_REPOSITORY" --json url --jq '.url' 2>/dev/null || true)"
          STATUS=$(cat <<EOF
          release=v1.1.1-mihomo2-test
          download=${DOWNLOAD_OUTCOME:-not-run}
          publish=${PUBLISH_OUTCOME:-not-run}
          verify=${VERIFY_OUTCOME:-not-run}
          source_run=32544173639
          url=${URL}
          updated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          )
          CONTENT="$(printf '%s\n' "$STATUS" | base64 -w0)"
          API="repos/${GITHUB_REPOSITORY}/contents/ci/publish-mihomo2-test-main-status.txt"
          EXISTING_SHA="$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API" -f message='chore: record Mihomo2 publisher status [skip ci]' -f content="$CONTENT" -f branch='main' -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message='chore: record Mihomo2 publisher status [skip ci]' -f content="$CONTENT" -f branch='main' >/dev/null
          fi

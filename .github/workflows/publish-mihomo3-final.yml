name: Publish Mihomo3 Final Test

on:
  push:
    branches: [main]
    paths: [ci/publish-mihomo3-final.txt]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      BUILD_RUN_ID: '32571332337'
      ARTIFACT_NAME: 'XVPN-v1.1.1-mihomo3'
      TAG: 'v1.1.1-mihomo3-test'
      OLD_TAG: 'v1.1.1-mihomo2-test'
    steps:
      - name: Download verified Mihomo3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist
          test -f dist/XVPN-v1.1.1-mihomo3.apk
          test -f dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Replace test release with final verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target dev/mihomo-core-v1 \
            --title 'XVPN v1.1.1-mihomo3 · 测试版' \
            --notes 'Mihomo/Clash Meta 测试版。包含 CN 域名/IP 智能分流、分流 DNS、IPv4/IPv6 TUN、MRS 规则校验和 Mihomo 1.19.28 内核版本显示。请重点测试智能分流、DNS/IPv6 泄漏及连接稳定性。' \
            --prerelease \
            dist/XVPN-v1.1.1-mihomo3.apk \
            dist/SHA256SUMS.txt

      - name: Verify release and clean failed Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATA="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url)"
          echo "$DATA" | jq -e '.tagName == "v1.1.1-mihomo3-test" and .isDraft == false and .isPrerelease == true' >/dev/null
          echo "$DATA" | jq -e '[.assets[].name] | index("XVPN-v1.1.1-mihomo3.apk") != null and index("SHA256SUMS.txt") != null' >/dev/null
          FAILED_IDS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[] | select(.conclusion=="failure") | .id' | sort -u)"
          DELETED=0
          for id in $FAILED_IDS; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1 || true
            DELETED=$((DELETED+1))
          done
          URL="$(echo "$DATA" | jq -r '.url')"
          BODY="run_id=${GITHUB_RUN_ID}\nbuild_run_id=${BUILD_RUN_ID}\nrelease=success\nprerelease=true\nold_mihomo2_removed=true\ndeleted_failed_runs=${DELETED}\ntag=${TAG}\nurl=${URL}\nupdated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          CONTENT="$(printf '%b' "$BODY" | base64 -w0)"
          API="repos/${GITHUB_REPOSITORY}/contents/ci/mihomo3-final-release-status.txt"
          SHA="$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message='chore: record Mihomo3 final release [skip ci]' -f content="$CONTENT" -f branch=main -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message='chore: record Mihomo3 final release [skip ci]' -f content="$CONTENT" -f branch=main >/dev/null
          fi

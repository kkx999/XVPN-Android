name: Publish Mihomo Test Release

on:
  push:
    branches:
      - dev/mihomo-core-v1
    paths:
      - ci/publish-mihomo-test.txt

permissions:
  contents: write
  actions: read

jobs:
  publish-test-release:
    name: Publish Mihomo test pre-release
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 32541717027 \
            --repo "$GITHUB_REPOSITORY" \
            --name 'XVPN-v1.1.1-mihomo1' \
            --dir dist
          test -f 'dist/XVPN-v1.1.1-mihomo1.apk'
          test -f 'dist/SHA256SUMS.txt'
          sha256sum -c dist/SHA256SUMS.txt

      - name: Publish clearly marked test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.1-mihomo1-test'
          TITLE='XVPN v1.1.1-mihomo1 · 测试版'
          cat > release-notes.md <<'EOF'
          ## ⚠️ 测试版 / Pre-release

          这是 XVPN Android 切换到 **Mihomo / Clash Meta 内核**后的第一版测试包，不是正式稳定版。

          **版本：** 1.1.1-mihomo1  
          **内核：** Mihomo / Clash Meta  
          **架构：** arm64-v8a

          本版本主要用于真机验证：
          - VPN 是否可以正常连接和断开
          - 全局模式与智能分流
          - 节点切换
          - iplark 等出口 IP 检测
          - DNS / IPv6 泄漏
          - Panel 流量上报

          APK 已通过 GitHub Actions 编译、签名、包信息和 native core 校验。请仅用于测试，确认稳定后再发布正式版本。
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/XVPN-v1.1.1-mihomo1.apk dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              dist/XVPN-v1.1.1-mihomo1.apk \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target ad2a6b04267cdb90f24be6d4cb105666fe885a7a \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Verify release classification and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.1.1-mihomo1-test")"
          echo "$RELEASE_JSON" | jq -e '.prerelease == true and .draft == false' >/dev/null
          echo "$RELEASE_JSON" | jq -e '[.assets[].name] | index("XVPN-v1.1.1-mihomo1.apk") != null' >/dev/null
          echo "$RELEASE_JSON" | jq -e '[.assets[].name] | index("SHA256SUMS.txt") != null' >/dev/null

name: Publish Mihomo4 Test

on:
  push:
    branches:
      - main
    paths:
      - ci/publish-mihomo4-test.txt

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      BUILD_RUN_ID: '32573446678'
      SOURCE_SHA: '00461f143896656a9997b07281d008cd9d855098'
      ARTIFACT_NAME: 'XVPN-v1.1.1-mihomo4'
      TAG: 'v1.1.1-mihomo4-test'
      OLD_TAG: 'v1.1.1-mihomo3-test'
    steps:
      - name: Download verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist
          test -f dist/XVPN-v1.1.1-mihomo4.apk
          test -f dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Replace previous test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'XVPN v1.1.1-mihomo4 · 测试版' \
            --notes 'Mihomo/Clash Meta 测试版。保持已验证的智能分流、DNS 与真实 IP 防泄漏配置不变；修复节点抽屉从节点卡片区域无法顺畅滚动、每次打开仅展开当前选中节点所在国家；加强连接按钮快速连点保护，并将 STOPPING 保持到 VPN Service 真正销毁，降低频繁连接/断开导致的生命周期竞争与闪退风险。' \
            --prerelease \
            dist/XVPN-v1.1.1-mihomo4.apk \
            dist/SHA256SUMS.txt

      - name: Verify release and clean failed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATA="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,assets,url)"
          echo "$DATA" | jq -e '.tagName == "v1.1.1-mihomo4-test" and .isDraft == false and .isPrerelease == true' >/dev/null
          echo "$DATA" | jq -e '[.assets[].name] | index("XVPN-v1.1.1-mihomo4.apk") != null and index("SHA256SUMS.txt") != null' >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if gh release view "$OLD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Old Mihomo3 test release still exists'
            exit 1
          fi
          FAILED_IDS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[] | select(.conclusion=="failure") | .id' | sort -u)"
          DELETED=0
          for id in $FAILED_IDS; do
            if [ "$id" = "$GITHUB_RUN_ID" ]; then continue; fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1 || true
            DELETED=$((DELETED+1))
          done
          URL="$(echo "$DATA" | jq -r '.url')"
          BODY="run_id=${GITHUB_RUN_ID}\nbuild_run_id=${BUILD_RUN_ID}\nsource_sha=${SOURCE_SHA}\nrelease=success\nprerelease=true\nold_mihomo3_removed=true\ndeleted_failed_runs=${DELETED}\ntag=${TAG}\nurl=${URL}\nupdated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
          CONTENT="$(printf '%b' "$BODY" | base64 -w0)"
          API="repos/${GITHUB_REPOSITORY}/contents/ci/mihomo4-release-status.txt"
          SHA="$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message='chore: record Mihomo4 release [skip ci]' -f content="$CONTENT" -f branch=main -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message='chore: record Mihomo4 release [skip ci]' -f content="$CONTENT" -f branch=main >/dev/null
          fi

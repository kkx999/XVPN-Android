name: Hash Mihomo CN Rules

on:
  push:
    branches:
      - dev/mihomo-core-v1
    paths:
      - ci/hash-mihomo-rules.txt

permissions:
  contents: write

jobs:
  hash-rules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download pinned MetaCubeX MRS rules and hash
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='669d7042b3590f4d1a664469df27fee4ddf188d6'
          mkdir -p /tmp/mihomo-rules
          curl -fL --retry 3 --connect-timeout 15 \
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/${COMMIT}/geo/geosite/cn.mrs" \
            -o /tmp/mihomo-rules/geosite-cn.mrs
          curl -fL --retry 3 --connect-timeout 15 \
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/${COMMIT}/geo/geoip/cn.mrs" \
            -o /tmp/mihomo-rules/geoip-cn.mrs
          test -s /tmp/mihomo-rules/geosite-cn.mrs
          test -s /tmp/mihomo-rules/geoip-cn.mrs
          DOMAIN_SHA="$(sha256sum /tmp/mihomo-rules/geosite-cn.mrs | awk '{print $1}')"
          IP_SHA="$(sha256sum /tmp/mihomo-rules/geoip-cn.mrs | awk '{print $1}')"
          DOMAIN_SIZE="$(stat -c %s /tmp/mihomo-rules/geosite-cn.mrs)"
          IP_SIZE="$(stat -c %s /tmp/mihomo-rules/geoip-cn.mrs)"
          mkdir -p ci
          {
            echo "source=MetaCubeX/meta-rules-dat"
            echo "commit=${COMMIT}"
            echo "geosite_cn_sha256=${DOMAIN_SHA}"
            echo "geosite_cn_size=${DOMAIN_SIZE}"
            echo "geoip_cn_sha256=${IP_SHA}"
            echo "geoip_cn_size=${IP_SIZE}"
            echo "verified_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci/mihomo-rule-hashes.txt

      - name: Record verified hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ci/mihomo-rule-hashes.txt
          git commit -m 'chore: record pinned Mihomo CN rule hashes [skip ci]'
          git push origin HEAD:dev/mihomo-core-v1

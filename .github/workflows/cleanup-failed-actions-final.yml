name: Cleanup Failed Actions Final

on:
  push:
    branches:
      - main
    paths:
      - ci/cleanup-failed-actions-final.txt

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete completed failed workflow runs
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t RUN_IDS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "failure") | .id'
          )
          deleted=0
          for run_id in "${RUN_IDS[@]}"; do
            [ -n "$run_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            deleted=$((deleted + 1))
          done
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"

      - name: Verify and record result
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DELETED: ${{ steps.cleanup.outputs.deleted }}
        run: |
          set -euo pipefail
          remaining="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "failure")] | length' | awk '{s+=$1} END {print s+0}')"
          STATUS=$(cat <<EOF
          cleanup=success
          deleted=${DELETED:-0}
          remaining_failed=${remaining}
          cleanup_run=${GITHUB_RUN_ID}
          updated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          )
          CONTENT="$(printf '%s\n' "$STATUS" | base64 -w0)"
          API="repos/${GITHUB_REPOSITORY}/contents/ci/cleanup-failed-actions-final-status.txt"
          EXISTING_SHA="$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API" -f message='chore: record final Actions cleanup [skip ci]' -f content="$CONTENT" -f branch='main' -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message='chore: record final Actions cleanup [skip ci]' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
          test "$remaining" -eq 0

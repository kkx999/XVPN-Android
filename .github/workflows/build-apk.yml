name: Build XVPN Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          ./gradlew clean :app:assembleRelease

      - name: Generate SHA256
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/XVPN.apk
          cd dist
          sha256sum XVPN.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XVPN-Android-v1.0.0
          path: dist/*

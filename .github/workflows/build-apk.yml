name: Build XVPN Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev/mihomo-core-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Persist Mihomo core version in existing version row
        if: ${{ github.event_name == 'push' && github.ref_name == 'dev/mihomo-core-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/xvpn/android/MainActivity.java')
          s = p.read_text()
          old = 'View versionRow=settingRow("版本",BuildConfig.VERSION_NAME + " · 检查更新",()->checkForUpdates(true));'
          new = 'View versionRow=settingRow("版本",BuildConfig.VERSION_NAME + " · Mihomo " + BuildConfig.MIHOMO_CORE_VERSION + " · 检查更新",()->checkForUpdates(true));'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Existing version row changed unexpectedly; refusing broad UI rewrite')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check -- app/src/main/java/com/xvpn/android/MainActivity.java
          if ! git diff --quiet -- app/src/main/java/com/xvpn/android/MainActivity.java; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/src/main/java/com/xvpn/android/MainActivity.java
            git commit -m 'feat: show Mihomo core version in version row [skip ci]'
            git push origin HEAD:dev/mihomo-core-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Ensure Android SDK 36 is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Read and verify app identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.xvpn.android'" app/build.gradle
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n1)"
          test -n "$VERSION_CODE" || { echo 'Unable to read versionCode'; exit 1; }
          test -n "$VERSION_NAME" || { echo 'Unable to read versionName'; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Invalid versionCode'; exit 1; }
          [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid versionName'; exit 1; }
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION_NAME" || { echo 'VERSION file does not match app/build.gradle'; exit 1; }
          grep -Fq 'static final String DEFAULT_PANEL_BASE = "https://xvpn.666101.xyz";' app/src/main/java/com/xvpn/android/ApiClient.java
          grep -Fq 'android:name="android.net.VpnService.SUPPORTS_ALWAYS_ON"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:value="true"' app/src/main/AndroidManifest.xml
          ACTIVE_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$ACTIVE_BRANCH" = 'dev/mihomo-core-v1' ]; then
            grep -Fq "def mihomoWrapperVersion = '0.3.1'" app/build.gradle
            grep -Fq "def mihomoCoreVersion = '1.19.28'" app/build.gradle
            grep -Fq "def mihomoRulesCommit = '669d7042b3590f4d1a664469df27fee4ddf188d6'" app/build.gradle
            grep -Fq "versionName '1.1.1-mihomo4'" app/build.gradle
            grep -Fq 'BuildConfig.MIHOMO_CORE_VERSION' app/src/main/java/com/xvpn/android/MainActivity.java
            grep -Fq 'boolean isActive() { return active; }' app/src/main/java/com/xvpn/android/SelectionDotView.java
            grep -Fq 'resetNodePickerExpansionIfPresent' app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java
            grep -Fq 'CLICK_GUARD_MS = 700L' app/src/main/java/com/xvpn/android/ConnectOrbView.java
            grep -Fq 'state == STOPPED && VpnCoreService.isLive()' app/src/main/java/com/xvpn/android/CoreState.java
            grep -Fq 'android:name=".MihomoRuleProvider"' app/src/main/AndroidManifest.xml
            grep -Fq 'BuildConfig.MIHOMO_GEOSITE_CN_SHA256' app/src/main/java/com/xvpn/android/MihomoRuleProvider.java
            grep -Fq 'BuildConfig.MIHOMO_GEOIP_CN_SHA256' app/src/main/java/com/xvpn/android/MihomoRuleProvider.java
            grep -Fq 'RULE-SET,' app/src/main/java/com/xvpn/android/MihomoProfileBuilder.java
            grep -Fq 'import io.github.oviron.libmihomo.Clash;' app/src/main/java/com/xvpn/android/VpnCoreService.java
            ! grep -Fq 'io.nekohasekai.libbox' app/src/main/java/com/xvpn/android/VpnCoreService.java
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building XVPN $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Restore permanent release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XVPN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XVPN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XVPN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XVPN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing secret: XVPN_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing secret: XVPN_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing secret: XVPN_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing secret: XVPN_KEY_PASSWORD'; exit 1; }
          KEYSTORE_PATH="${RUNNER_TEMP}/xvpn-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "XVPN_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "XVPN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XVPN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XVPN_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Lint and build signed release APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease 2>&1 | tee build.log

      - name: Verify APK signature, package, rules and native core
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(command -v apksigner || true)"
          AAPT="$(command -v aapt || true)"
          ZIPALIGN="$(command -v zipalign || true)"
          if [ -z "$APKSIGNER" ]; then APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"; fi
          if [ -z "$AAPT" ]; then AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"; fi
          if [ -z "$ZIPALIGN" ]; then ZIPALIGN="${ANDROID_HOME}/build-tools/35.0.0/zipalign"; fi
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ZIPALIGN" -c -P 16 4 "$APK"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          printf '%s\n' "$SIGNATURE_OUTPUT" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.xvpn.android' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'36'"
          printf '%s\n' "$BADGING" | grep -F "native-code: 'arm64-v8a'"
          MANIFEST_TREE="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          printf '%s\n' "$MANIFEST_TREE" | grep -F 'android.net.VpnService.SUPPORTS_ALWAYS_ON'
          ACTIVE_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$ACTIVE_BRANCH" = 'dev/mihomo-core-v1' ]; then
            printf '%s\n' "$MANIFEST_TREE" | grep -F 'com.xvpn.android.MihomoRuleProvider'
            unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libclash.so'
            unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libmihomo-jni.so'
            unzip -Z1 "$APK" | grep -Fx 'assets/mihomo-rules/geosite-cn.mrs'
            unzip -Z1 "$APK" | grep -Fx 'assets/mihomo-rules/geoip-cn.mrs'
            test "$(unzip -p "$APK" assets/mihomo-rules/geosite-cn.mrs | sha256sum | awk '{print $1}')" = 'a7368abc76702b0a7886d00054815df2fc0a1662239c916f1c4239c25e1af085'
            test "$(unzip -p "$APK" assets/mihomo-rules/geoip-cn.mrs | sha256sum | awk '{print $1}')" = 'a7db74faad22913bd2d193be4c33d46dddc2e0948ebff9f0fff044bb6416a734'
            if unzip -Z1 "$APK" | grep -E '^assets/rules/.*\.srs$'; then
              echo 'Unexpected obsolete sing-box SRS rule in Mihomo APK'
              exit 1
            fi
            if unzip -Z1 "$APK" | grep -F 'libbox.so'; then
              echo 'Unexpected sing-box libbox.so in Mihomo APK'
              exit 1
            fi
          fi
          EXPECTED_CERT="$(tr -d ':[:space:]' < SIGNING_CERT_SHA256.txt | tr 'A-F' 'a-f')"
          ACTUAL_CERT="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

      - name: Prepare artifact
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_NAME="XVPN-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          cd dist
          sha256sum "$APK_NAME" > SHA256SUMS.txt

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: XVPN-v${{ env.VERSION_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Record Mihomo CI status
        if: ${{ always() && github.event_name == 'push' && github.ref_name == 'dev/mihomo-core-v1' }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "build=${BUILD_OUTCOME:-not-run}"
            echo "verify=${VERIFY_OUTCOME:-not-run}"
            echo "prepare=${PREPARE_OUTCOME:-not-run}"
            echo "upload=${UPLOAD_OUTCOME:-not-run}"
            echo "updated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- build-log-tail ---"
            tail -n 160 build.log 2>/dev/null || true
          } > ci/mihomo-last-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ci/mihomo-last-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Mihomo CI status [skip ci]'
            git push origin HEAD:dev/mihomo-core-v1
          fi

name: Apply Mihomo3 Runtime Patch

on:
  push:
    branches:
      - dev/mihomo-core-v1
    paths:
      - ci/apply-mihomo3-runtime.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/mihomo-core-v1

      - name: Apply exact Mihomo3 runtime/UI/test patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # MainActivity: show both app version and native core version.
          p = Path('app/src/main/java/com/xvpn/android/MainActivity.java')
          s = p.read_text()
          old = 'View versionRow=settingRow("版本",BuildConfig.VERSION_NAME + " · 检查更新",()->checkForUpdates(true));'
          new = 'View versionRow=settingRow("版本",BuildConfig.VERSION_NAME + " · " + MihomoProfileBuilder.CORE_LABEL + " · 检查更新",()->checkForUpdates(true));'
          if old not in s:
              raise SystemExit('MainActivity version row anchor missing')
          s = s.replace(old, new, 1)
          old = 'info.addView(detailLine("账户状态","正常"),matchWrap()); info.addView(divider()); info.addView(detailLine("客户端版本",BuildConfig.VERSION_NAME),matchWrap()); sheet.addView(info,matchWrap()); gap(sheet,16);'
          new = 'info.addView(detailLine("账户状态","正常"),matchWrap()); info.addView(divider()); info.addView(detailLine("客户端版本",BuildConfig.VERSION_NAME),matchWrap()); info.addView(divider()); info.addView(detailLine("内核版本",MihomoProfileBuilder.CORE_LABEL),matchWrap()); sheet.addView(info,matchWrap()); gap(sheet,16);'
          if old not in s:
              raise SystemExit('MainActivity account summary anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # VpnCoreService: materialize bundled MRS files into Mihomo home and verify SHA-256 at runtime.
          p = Path('app/src/main/java/com/xvpn/android/VpnCoreService.java')
          s = p.read_text()
          old = 'import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.io.OutputStreamWriter;'
          new = 'import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.io.InputStream;\nimport java.io.OutputStreamWriter;'
          if old not in s:
              raise SystemExit('VpnCoreService IO import anchor missing')
          s = s.replace(old, new, 1)
          old = 'import java.nio.charset.StandardCharsets;\nimport java.util.Locale;'
          new = 'import java.nio.charset.StandardCharsets;\nimport java.security.MessageDigest;\nimport java.util.Locale;'
          if old not in s:
              raise SystemExit('VpnCoreService security import anchor missing')
          s = s.replace(old, new, 1)
          old = '        File home = new File(getFilesDir(), "mihomo");\n        if (!home.exists() && !home.mkdirs()) throw new IOException("无法创建 Mihomo 配置目录");\n        File config = new File(home, "config.yaml");'
          new = '        File home = new File(getFilesDir(), "mihomo");\n        if (!home.exists() && !home.mkdirs()) throw new IOException("无法创建 Mihomo 配置目录");\n        ensureBundledMihomoRules(home);\n        File config = new File(home, "config.yaml");'
          if old not in s:
              raise SystemExit('VpnCoreService apply profile anchor missing')
          s = s.replace(old, new, 1)
          anchor = '    private void applyMihomoProfile(String sourceConfig, String label) throws Exception {'
          idx = s.find(anchor)
          if idx < 0:
              raise SystemExit('applyMihomoProfile method missing')
          insert = r'''
    private void ensureBundledMihomoRules(File home) throws Exception {
        File rulesDir = new File(home, "rules");
        if (!rulesDir.exists() && !rulesDir.mkdirs()) throw new IOException("无法创建 Mihomo 规则目录");
        installBundledRule("mihomo-rules/geosite-cn.mrs", new File(rulesDir, "geosite-cn.mrs"), BuildConfig.MIHOMO_GEOSITE_CN_SHA256);
        installBundledRule("mihomo-rules/geoip-cn.mrs", new File(rulesDir, "geoip-cn.mrs"), BuildConfig.MIHOMO_GEOIP_CN_SHA256);
    }

    private void installBundledRule(String assetPath, File target, String expectedSha256) throws Exception {
        if (target.isFile() && expectedSha256.equalsIgnoreCase(sha256(target))) return;
        File temp = new File(target.getParentFile(), target.getName() + ".tmp");
        if (temp.exists() && !temp.delete()) throw new IOException("无法清理 Mihomo 规则临时文件");
        try (InputStream input = getAssets().open(assetPath); FileOutputStream output = new FileOutputStream(temp, false)) {
            byte[] buffer = new byte[64 * 1024];
            int read;
            while ((read = input.read(buffer)) >= 0) {
                if (read > 0) output.write(buffer, 0, read);
            }
            output.getFD().sync();
        }
        String actual = sha256(temp);
        if (!expectedSha256.equalsIgnoreCase(actual)) {
            temp.delete();
            throw new IOException("Mihomo 内置规则校验失败：" + assetPath);
        }
        if (target.exists() && !target.delete()) {
            temp.delete();
            throw new IOException("无法替换 Mihomo 规则：" + target.getName());
        }
        if (!temp.renameTo(target)) {
            try (InputStream input = new java.io.FileInputStream(temp); FileOutputStream output = new FileOutputStream(target, false)) {
                byte[] buffer = new byte[64 * 1024];
                int read;
                while ((read = input.read(buffer)) >= 0) {
                    if (read > 0) output.write(buffer, 0, read);
                }
                output.getFD().sync();
            }
            if (!temp.delete()) Log.w(TAG, "Unable to delete Mihomo rule temp file: " + temp);
        }
    }

    private static String sha256(File file) throws Exception {
        MessageDigest digest = MessageDigest.getInstance("SHA-256");
        try (InputStream input = new java.io.FileInputStream(file)) {
            byte[] buffer = new byte[64 * 1024];
            int read;
            while ((read = input.read(buffer)) >= 0) if (read > 0) digest.update(buffer, 0, read);
        }
        StringBuilder out = new StringBuilder(64);
        for (byte b : digest.digest()) out.append(String.format(Locale.US, "%02x", b & 0xff));
        return out.toString();
    }

'''
          s = s[:idx] + insert + s[idx:]
          p.write_text(s)

          # Tests: smart mode must contain both bundled CN providers; global mode must not.
          p = Path('app/src/test/java/com/xvpn/android/SafeYamlTest.java')
          s = p.read_text()
          anchor = '\n    @Test\n    public void trojanPasswordCannotBreakYaml() throws Exception {'
          if anchor not in s:
              raise SystemExit('SafeYamlTest anchor missing')
          test = r'''

    @Test
    public void smartModeUsesBundledCnDomainAndIpProviders() throws Exception {
        JSONObject outbound = new JSONObject()
                .put("type", "vless")
                .put("server", "example.com")
                .put("server_port", 443)
                .put("uuid", "11111111-2222-3333-4444-555555555555");
        String source = new JSONObject().put("outbounds", new JSONArray().put(outbound)).toString();
        String smart = MihomoProfileBuilder.build(source, "智能分流");
        assertTrue(smart.contains("\"rule-providers\""));
        assertTrue(smart.contains("\"XVPN-CN-DOMAIN\""));
        assertTrue(smart.contains("\"./rules/geosite-cn.mrs\""));
        assertTrue(smart.contains("RULE-SET,XVPN-CN-DOMAIN,DIRECT"));
        assertTrue(smart.contains("RULE-SET,XVPN-CN-IP,DIRECT,no-resolve"));

        String global = MihomoProfileBuilder.build(source, "全局模式");
        assertFalse(global.contains("\"rule-providers\""));
        assertFalse(global.contains("RULE-SET,XVPN-CN-DOMAIN,DIRECT"));
        assertFalse(global.contains("RULE-SET,XVPN-CN-IP,DIRECT,no-resolve"));
    }
'''
          s = s.replace(anchor, test + anchor, 1)
          p.write_text(s)

          # Build verification: ensure pinned rules and version label are actually packaged/wired.
          p = Path('.github/workflows/build-apk.yml')
          s = p.read_text()
          old = "            grep -Fq \"def mihomoWrapperVersion = '0.3.1'\" app/build.gradle\n            grep -Fq 'import io.github.oviron.libmihomo.Clash;' app/src/main/java/com/xvpn/android/VpnCoreService.java"
          new = "            grep -Fq \"def mihomoWrapperVersion = '0.3.1'\" app/build.gradle\n            grep -Fq \"def mihomoCoreVersion = '1.19.28'\" app/build.gradle\n            grep -Fq \"def mihomoRulesCommit = '669d7042b3590f4d1a664469df27fee4ddf188d6'\" app/build.gradle\n            grep -Fq 'MihomoProfileBuilder.CORE_LABEL' app/src/main/java/com/xvpn/android/MainActivity.java\n            grep -Fq 'import io.github.oviron.libmihomo.Clash;' app/src/main/java/com/xvpn/android/VpnCoreService.java"
          if old not in s:
              raise SystemExit('build workflow identity anchor missing')
          s = s.replace(old, new, 1)
          old = "            unzip -Z1 \"$APK\" | grep -Fx 'lib/arm64-v8a/libmihomo-jni.so'\n            if unzip -Z1 \"$APK\" | grep -F 'libbox.so'; then"
          new = "            unzip -Z1 \"$APK\" | grep -Fx 'lib/arm64-v8a/libmihomo-jni.so'\n            unzip -Z1 \"$APK\" | grep -Fx 'assets/mihomo-rules/geosite-cn.mrs'\n            unzip -Z1 \"$APK\" | grep -Fx 'assets/mihomo-rules/geoip-cn.mrs'\n            unzip -p \"$APK\" assets/mihomo-rules/geosite-cn.mrs | sha256sum | grep -F 'a7368abc76702b0a7886d00054815df2fc0a1662239c916f1c4239c25e1af085'\n            unzip -p \"$APK\" assets/mihomo-rules/geoip-cn.mrs | sha256sum | grep -F 'a7db74faad22913bd2d193be4c33d46dddc2e0948ebff9f0fff044bb6416a734'\n            if unzip -Z1 \"$APK\" | grep -F 'libbox.so'; then"
          if old not in s:
              raise SystemExit('build workflow native verification anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          # Old sing-box SRS files are no longer consumed by the Mihomo build.
          rm -f app/src/main/assets/rules/geoip-cn.srs app/src/main/assets/rules/geosite-geolocation-cn.srs

          git diff --check
          git diff -- app/src/main/java/com/xvpn/android/MainActivity.java \
                     app/src/main/java/com/xvpn/android/VpnCoreService.java \
                     app/src/test/java/com/xvpn/android/SafeYamlTest.java \
                     .github/workflows/build-apk.yml \
                     app/src/main/assets/rules

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/com/xvpn/android/MainActivity.java \
                     app/src/main/java/com/xvpn/android/VpnCoreService.java \
                     app/src/test/java/com/xvpn/android/SafeYamlTest.java \
                     .github/workflows/build-apk.yml \
                     app/src/main/assets/rules/geoip-cn.srs \
                     app/src/main/assets/rules/geosite-geolocation-cn.srs
          git diff --cached --check
          git commit -m 'feat: finish Mihomo3 smart routing and core version UI [skip ci]'
          git push origin HEAD:dev/mihomo-core-v1

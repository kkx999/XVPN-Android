name: Apply Mihomo4 Stability Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore: apply mihomo4 stability patch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/mihomo-core-v1
          fetch-depth: 0

      - name: Apply drawer and rapid-toggle fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              if new in s:
                  return s
              if old not in s:
                  raise SystemExit(label + ' anchor missing')
              return s.replace(old, new, 1)

          p=Path('app/src/main/java/com/xvpn/android/MainActivity.java'); s=p.read_text()
          s=once(s,
              '    private static final long UPDATE_CHECK_INTERVAL_MS = 12L * 60L * 60L * 1000L;\n',
              '    private static final long UPDATE_CHECK_INTERVAL_MS = 12L * 60L * 60L * 1000L;\n    private static final long CONNECT_ACTION_GUARD_MS = 500L;\n',
              'connect guard constant')
          s=once(s,'    private boolean coreReceiverRegistered;\n','    private boolean coreReceiverRegistered;\n    private long lastConnectActionAt;\n','connect guard field')
          s=once(s,
              '        CoreState.Snapshot core=CoreState.read(this);\n        if(core.state==CoreState.RUNNING){\n            VpnCoreService.stop(this);\n            refreshCoreBoundViews();\n            return;\n        }',
              '        long actionNow=SystemClock.uptimeMillis();\n        if(lastConnectActionAt!=0L && actionNow-lastConnectActionAt<CONNECT_ACTION_GUARD_MS)return;\n        lastConnectActionAt=actionNow;\n        CoreState.Snapshot core=CoreState.read(this);\n        if(core.state==CoreState.RUNNING){\n            try{VpnCoreService.stop(this);}\n            catch(RuntimeException error){toast("无法提交断开请求，请稍后重试");}\n            refreshCoreBoundViews();\n            return;\n        }',
              'handleConnect debounce')
          s=once(s,
              '        clearPendingCore();\n        VpnCoreService.start(this,config,id,name,label,latencyTestUrl());\n        refreshCoreBoundViews();',
              '        clearPendingCore();\n        try{VpnCoreService.start(this,config,id,name,label,latencyTestUrl());}\n        catch(RuntimeException error){toast("VPN 服务正在切换，请稍后重试");}\n        refreshCoreBoundViews();',
              'safe VPN start')
          s=once(s,
              '            String key="node_country_collapsed_"+c.code;\n            boolean selectedHere=countryContainsSelected(c);\n            boolean collapsed=prefs.contains(key)?prefs.getBoolean(key,false):!selectedHere;\n            if(selectedHere) collapsed=false;\n',
              '            boolean selectedHere=countryContainsSelected(c);\n            // A fresh picker opens only the selected node country.\n            boolean collapsed=!selectedHere;\n',
              'picker initial expansion')
          s=once(s,'                arrow.animateExpanded(!hide); prefs.edit().putBoolean(key,hide).apply();\n','                arrow.animateExpanded(!hide);\n','picker persistence')
          p.write_text(s)

          p=Path('app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java'); s=p.read_text()
          s=once(s,
              '        if(event.getActionMasked()==MotionEvent.ACTION_DOWN){\n            begin(event);\n            // The top strip contains only the visual handle, so taking its DOWN\n            // event cannot steal taps from sheet controls or normal scrolling.\n            return handleGesture;\n        }\n        return super.onInterceptTouchEvent(event);',
              '        if(event.getActionMasked()==MotionEvent.ACTION_DOWN){\n            begin(event);\n            // Only the top drag strip is owned by the dismiss gesture. Normal\n            // rows must pass DOWN to ScrollView so MOVE can become scrolling.\n            if(handleGesture)return true;\n            return super.onInterceptTouchEvent(event);\n        }\n        return super.onInterceptTouchEvent(event);',
              'scroll ACTION_DOWN')
          p.write_text(s)

          p=Path('app/src/main/java/com/xvpn/android/VpnCoreService.java'); s=p.read_text()
          s=once(s,'import java.util.concurrent.Executors;\nimport java.util.concurrent.ScheduledExecutorService;','import java.util.concurrent.Executors;\nimport java.util.concurrent.RejectedExecutionException;\nimport java.util.concurrent.ScheduledExecutorService;','rejected import')
          s=once(s,
              '        if (ACTION_STOP.equals(action)) {\n            requestStop();\n            return START_NOT_STICKY;\n        }\n\n        if (ACTION_RECONFIGURE.equals(action) && intent != null) {',
              '        if (ACTION_STOP.equals(action)) {\n            requestStop();\n            return START_NOT_STICKY;\n        }\n\n        if (ACTION_START.equals(action)) {\n            CoreState.Snapshot current = CoreState.read(this);\n            if (stopRequested.get() || current.state == CoreState.STARTING\n                    || current.state == CoreState.SWITCHING || current.state == CoreState.STOPPING) {\n                return START_NOT_STICKY;\n            }\n            if (current.state == CoreState.RUNNING || tunStarted) return START_STICKY;\n        }\n\n        if (ACTION_RECONFIGURE.equals(action) && intent != null) {',
              'duplicate start guard')
          s=once(s,
              '            establishAndStartTun();\n            if (stopRequested.get()) { stopCoreInternal(); return; }\n',
              '            establishAndStartTun();\n            // requestStop() already queues the single serialized stop task.\n            if (stopRequested.get()) return;\n',
              'single stop task')
          s=once(s,
              '        cleanupCoreObjects();\n        CoreState.Snapshot state = CoreState.read(this);\n        if (state.isActive()) CoreState.publishLifecycle(this, CoreState.STOPPED, state.nodeId, state.nodeName, "");\n        coreExecutor.shutdownNow();\n        reportIo.shutdown();\n        super.onDestroy();',
              '        cleanupCoreObjects();\n        CoreState.Snapshot state = CoreState.read(this);\n        coreExecutor.shutdownNow();\n        reportIo.shutdown();\n        // Expose STOPPED only when the old Service really finishes destroying.\n        if (state.isActive()) CoreState.publishLifecycle(this, CoreState.STOPPED, state.nodeId, state.nodeName, "");\n        super.onDestroy();',
              'destroy ordering')
          s=once(s,
              '        updateForegroundNotification("XVPN 正在断开", displayNodeName() + " · 正在保存连接数据", false);\n        coreExecutor.execute(this::stopCoreInternal);',
              '        updateForegroundNotification("XVPN 正在断开", displayNodeName() + " · 正在保存连接数据", false);\n        try { coreExecutor.execute(this::stopCoreInternal); }\n        catch (RejectedExecutionException ignored) { stopCoreInternal(); }',
              'safe stop executor')
          s=once(s,
              '        cleanupCoreObjects();\n        CoreState.publishLifecycle(this, CoreState.STOPPED, nodeId, nodeName, "");\n        stopForeground(STOP_FOREGROUND_REMOVE);\n        stopSelf();',
              '        cleanupCoreObjects();\n        // Stay STOPPING until onDestroy() so a reconnect cannot race stopSelf().\n        stopForeground(STOP_FOREGROUND_REMOVE);\n        stopSelf();',
              'defer STOPPED')
          s=once(s,
              '        if (finalSnapshot != null) reportIo.execute(() -> reportTrafficSafe(finalSnapshot));',
              '        if (finalSnapshot != null && !reportIo.isShutdown()) {\n            try { reportIo.execute(() -> reportTrafficSafe(finalSnapshot)); }\n            catch (RejectedExecutionException ignored) {}\n        }',
              'safe report executor')
          p.write_text(s)

          p=Path('app/build.gradle'); s=p.read_text()
          s=once(s,"        versionCode 10104\n        versionName '1.1.1-mihomo3'","        versionCode 10105\n        versionName '1.1.1-mihomo4'",'version bump')
          p.write_text(s); Path('VERSION').write_text('1.1.1-mihomo4\n')

          p=Path('.github/workflows/build-apk.yml'); s=p.read_text()
          s=once(s,"            grep -Fq \"versionName '1.1.1-mihomo3'\" app/build.gradle","            grep -Fq \"versionName '1.1.1-mihomo4'\" app/build.gradle",'CI version')
          marker="            grep -Fq 'BuildConfig.MIHOMO_CORE_VERSION' app/src/main/java/com/xvpn/android/MainActivity.java\n"
          if "grep -Fq 'CONNECT_ACTION_GUARD_MS'" not in s:
              if marker not in s: raise SystemExit('CI guard anchor missing')
              s=s.replace(marker,marker+"            grep -Fq 'CONNECT_ACTION_GUARD_MS' app/src/main/java/com/xvpn/android/MainActivity.java\n            grep -Fq 'boolean collapsed=!selectedHere;' app/src/main/java/com/xvpn/android/MainActivity.java\n            grep -Fq 'if(handleGesture)return true;' app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java\n            grep -Fq 'current.state == CoreState.STARTING' app/src/main/java/com/xvpn/android/VpnCoreService.java\n",1)
          p.write_text(s)
          PY

          git diff --check
          grep -Fq "versionName '1.1.1-mihomo4'" app/build.gradle
          grep -Fq 'CONNECT_ACTION_GUARD_MS' app/src/main/java/com/xvpn/android/MainActivity.java
          grep -Fq 'boolean collapsed=!selectedHere;' app/src/main/java/com/xvpn/android/MainActivity.java
          grep -Fq 'if(handleGesture)return true;' app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java
          grep -Fq 'current.state == CoreState.STARTING' app/src/main/java/com/xvpn/android/VpnCoreService.java

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/com/xvpn/android/MainActivity.java \
                     app/src/main/java/com/xvpn/android/DismissibleBottomSheetScrollView.java \
                     app/src/main/java/com/xvpn/android/VpnCoreService.java \
                     app/build.gradle VERSION .github/workflows/build-apk.yml
          git diff --cached --check
          git commit -m 'fix: harden node drawer and rapid VPN toggles'
          git push origin HEAD:dev/mihomo-core-v1
